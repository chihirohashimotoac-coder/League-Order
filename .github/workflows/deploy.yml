name: Build, verify and publish to GitHub Pages

# The app is a Vite PWA, so what gets published is the built `dist/`, never the
# repository root: `index.html` there is the Vite source entry and loads
# `/src/main.tsx`, which a browser cannot execute. Pages has no build step of its own,
# so the build happens here and the output is pushed to the `gh-pages` branch, which
# Pages serves directly.
#
# Publishing deliberately does NOT go through `actions/deploy-pages`. That route
# requires the `github-pages` deployment environment, whose branch protection rule
# rejected `main` ("Branch "main" is not allowed to deploy to github-pages due to
# environment protection rules") and is a repository setting rather than anything this
# workflow can control. Pushing a branch needs no environment, so this route cannot be
# blocked the same way.
#
# Publishing is gated on the full verification suite. These tests protect invariants
# nobody is watching for — above all that an order whose appearances are already counted
# in the season standings cannot be deleted — so a red suite must stop the release
# rather than annotate it. Steps run in order and a failure ends the job, so nothing
# reaches `gh-pages` unless everything before it passed.

on:
  push:
    branches: [main]
  # Lets a publish be re-run from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  # Only to push the built site to the `gh-pages` branch.
  contents: write

# Never let two publishes race onto the same branch. In-progress runs are allowed to
# finish so a half-pushed tree is never left behind.
concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  verify-build-and-publish:
    name: Verify, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit, integration and component tests
        run: npm test

      - name: Build
        run: npm run build

      # The repo's playwright.config.ts prefers a pre-installed Chromium when one is
      # present and otherwise falls back to Playwright's own, so the runner only needs
      # the browser it does not have.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (mobile and desktop)
        run: npm run test:e2e

      # Printed into the log as well as uploaded, because the artifact blob host is not
      # reachable from every network, and a failure nobody can read is a failure nobody
      # can fix. Each error-context.md holds the page's accessibility snapshot at the
      # moment the assertion gave up, which is usually the whole diagnosis.
      - name: Print the failure context
        if: failure()
        run: |
          found=0
          while IFS= read -r f; do
            found=1
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done < <(find test-results -name 'error-context.md' -print 2>/dev/null)
          [ "$found" = 0 ] && echo "no error-context.md files were produced"
          exit 0

      - name: Upload the Playwright report when the suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Reached only when every check above passed.
      #
      # `gh-pages` holds generated output, not source history: each publish replaces it
      # with a single fresh commit, so the force-push rewrites nothing anyone works from.
      # `vite.config.ts` sets `base: './'`, so the built asset, manifest and
      # service-worker references are relative and work unchanged under the project
      # sub-path (…github.io/League-Order/) with no rewriting here.
      - name: Publish the built site to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "dist/index.html is missing — refusing to publish"; exit 1; }

          # Stops Pages running Jekyll over the build, which would drop any path
          # beginning with an underscore.
          touch dist/.nojekyll

          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA} to GitHub Pages"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Published $(git rev-parse --short HEAD) to gh-pages"

      - name: Where the site will be served
        run: |
          echo "Set Settings → Pages → Source to: Deploy from a branch → gh-pages → / (root)"
          echo "The site is served at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

name: Backtest baseline check

# The same check the publish workflow runs before releasing (`npm run backtest:check`), run
# on a pull request that could change the report, so a difference is seen before merge instead
# of blocking the release. It needs no secret and publishes nothing. The evidence is in the log
# ("BACKTEST MATCH … sha256"), the job summary and the `backtest-report` artifact.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backtest-check.yml'

permissions:
  contents: read

jobs:
  backtest-check:
    name: Backtest matches the committed baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backtest matches the committed baseline
        run: npm run backtest:check

      - name: Upload the backtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest-report/
          retention-days: 30
          if-no-files-found: warn

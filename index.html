<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="ダーツリーグのオーダーを、メンバー・Rating・適性・出場条件・公平性を考慮して自動生成・調整できるオフライン対応アプリ"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Darts Order" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Darts League Order Optimizer</title>
    <!-- Paper background before the stylesheet arrives, so a cold start never flashes dark. -->
    <style>
      html,
      body {
        background: #f4f3ef;
        color: #172026;
      }
      /* 表示テーマ「スタジアム」の端末では、起動直後から濃い地にする (白く光らない)。 */
      html[data-theme='stadium'],
      html[data-theme='stadium'] body {
        background-color: #0d151b;
        color: #e9f0f3;
      }
    </style>
    <!-- 保存された表示テーマ (src/components/theme.ts と同じキー) を、最初の描画より前に適用する。 -->
    <script>
      try {
        var theme = window.localStorage.getItem('league-order:theme');
        if (theme === 'stadium' || theme === 'clean') document.documentElement.dataset.theme = theme;
      } catch (error) {
        /* 読めない環境では既定のテーマのまま */
      }
    </script>
    <script type="module" crossorigin src="./assets/index-uhCvQ968.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DJc-kVLy.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>
</html>
